# Runtime SQLite -> legacy JS generator configuration.
# Data is always read from NT/sqlites/*.sqlite; this file only defines routes,
# SQL/query conventions and the legacy JavaScript wrappers expected by the app.

# HTTP dynamic routes (matched against requested app resource path)
route.index_mn_suffix=viewer/index_mn.js
route.index_vb_suffix=viewer/index_vb.js
route.post=.*?/forum_(mn\\d+|vb\\d+)/js_json/posts/post_(\\d+)\\.js$
route.thread=.*?/forum_(mn\\d+|vb\\d+)/js_json/threads/thread_(\\d+)_pa_(\\d+)\\.js$
route.forum=.*?/forum_(mn\\d+|vb\\d+)/js_json/forums/forum_(?:mn|vb)\\d+_pa_(\\d+)_order_([A-Za-z]+)_lastpost\\.js$
route.sticky=.*?/forum_(mn\\d+|vb\\d+)/js_json/forums/stickyforum_(?:mn|vb)\\d+_order_([A-Za-z]+)_lastpost\\.js$

# Generated filenames (used only by explicit extract/export mode)
output.index_mn=index_mn.js
output.index_vb=index_vb.js
output.sticky=stickyforum_${publicKey}_order_${order}_lastpost.js
output.forum=forum_${publicKey}_pa_${page}_order_${order}_lastpost.js
output.thread=thread_${threadid}_pa_${page}.js
output.post=post_${postid}.js
output.thread_up=forum_${family}${forumid}_pa_${page}.html#thread-${threadid}
output.post_up=thread_${threadid}.html#post-${postid}

# JavaScript wrappers expected by app/www/res/viewer/app.js
js.index_mn=var INDEX_MN = ${json};
js.index_vb=var INDEX_VB = ${json};
js.forum_sticky=var FORUM_STICKY=${json};
js.forum_threads=var FORUM_THREADS=${json};
js.post=var RAW_JSON=${json};
js.loader_separator=,\\n
js.thread_post_loader=ver("js_json/posts/post_${postid}.js")
js.thread_asset_loader=ver(base + "Assets/loader.js")
js.thread=window.THREAD=${root};\\nwindow.__pushPost=function(o){window.THREAD.thread_data.push(o);};\\nloadAll([\\n${loads}\\n],0);\\n

# SQLite basics
sql.has_table=SELECT 1 FROM sqlite_master WHERE type='table' AND name=? LIMIT 1
sql.table_info=PRAGMA table_info("${table}")
sql.open_init=PRAGMA query_only=ON

# New compact SQLite structure and legacy-compatible reads
sql.index_forums=SELECT * FROM forums ORDER BY display_order, forumid
sql.forum_counters=SELECT formid, threads, posts, media_youtube FROM counts
sql.extract_thread_ids=SELECT threadid FROM threads ORDER BY threadid
sql.extract_post_ids=SELECT postid FROM posts ORDER BY postid
sql.thread_one=SELECT * FROM threads WHERE threadid=? LIMIT 1
sql.post_one=SELECT * FROM posts WHERE postid=? LIMIT 1
sql.thread_title=SELECT title FROM threads WHERE threadid=? LIMIT 1
sql.vb5_threads=SELECT * FROM threads ORDER BY threadid
sql.posts_uid_one=SELECT "${uid_column}" FROM posts WHERE postid=? LIMIT 1
sql.posts_for_threads=SELECT threadid,postid FROM posts WHERE threadid IN (${placeholders}) ORDER BY threadid,${order}
sql.post_ids_by_thread=SELECT postid FROM posts WHERE threadid=? ORDER BY ${order_column}
sql.normal_thread_count=SELECT COUNT(*) FROM threads WHERE (${sticky_expr})=0
sql.forum_threads_page=SELECT * FROM threads WHERE (${sticky_expr})=${sticky_value} ORDER BY ${time_expr} ${direction},threadid ${direction} LIMIT ? OFFSET ?
sql.thread_position=SELECT (${sticky_expr}) AS st,${time_expr} AS tm FROM threads WHERE threadid=? LIMIT 1
sql.thread_page_count_before=SELECT COUNT(*) FROM threads WHERE (${sticky_expr})=0 AND ${compare}

# Old paired _extra DB support remains optional
sql.users_all=SELECT * FROM user
sql.extra_thread_one=SELECT * FROM threads WHERE threadid=? LIMIT 1
sql.extra_threads_in=SELECT * FROM threads WHERE threadid IN (${placeholders})
sql.extra_post_one=SELECT * FROM posts WHERE postid=? LIMIT 1
sql.imam_posts=SELECT postid FROM posts WHERE "${uid_column}"=${imam_userid}
sql.extra_posts_all=SELECT * FROM posts
sql.extra_threads_all=SELECT * FROM threads
sql.forum_title=SELECT title FROM forums WHERE forumid=? LIMIT 1

# Column/schema detection
config.columns.sticky=sticky,is_sticky,pinned
config.sticky.true_values=1,true,yes,y,on
config.columns.thread_time=lastpost,lastupdate,edited,published,datetime,dateline,updated,timestamp
config.columns.post_userid=userid,user_id,useid
config.columns.post_order=published
config.order.asc_token=ASE
config.order.desc_token=DESE
config.order.asc_sql=ASC
config.order.desc_sql=DESC
config.forum.page_size=20
config.thread.page_size=10
config.sticky.limit=100000
config.imam.userid=4
config.sqlite.batch_size=400
config.content.bbcode_to_html=true

# SQL expression fragments
expr.sticky_field=CASE WHEN LOWER(CAST("${column}" AS TEXT)) IN ('1','true','yes','y','on') THEN 1 ELSE 0 END
expr.sticky_fallback=0
expr.thread_time_part=CAST(NULLIF("${column}",'') AS INTEGER)
expr.thread_time_fallback=0
expr.thread_time_wrap=COALESCE(${parts},0)
expr.post_order_with_time=published ASC,postid ASC
expr.post_order_fallback=postid ASC
expr.compare_asc=(${time_expr} < ? OR (${time_expr} = ? AND threadid < ?))
expr.compare_desc=(${time_expr} > ? OR (${time_expr} = ? AND threadid > ?))

# Integer math
math.last_page=max(1,ceildiv(total,page_size))
math.first_page=1
math.page_loop_next=page+1
math.normalize_page=max(1,page)
math.counter_sum=left+right
math.position_from_index=index+1
math.page_from_position=max(1,ceildiv(position,page_size))
math.zero_item_page=(index/page_size)+1
math.batch_next=min(total,from+batch_size)
math.batch_end=min(total,from+batch_size)
math.bind_index=index-from+1
math.offset_from_page=(max(1,page)-1)*page_size
math.target_page=(before/page_size)+1
math.slice_from=min(total,(max(1,page)-1)*page_size)
math.slice_to=min(total,from+page_size)
